name: Python AI Core Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.2,<3.0'
      - name: Install pinned Python test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Run Python regression tests
        run: python -m unittest discover -s tests/python -v
      - name: Run CPU forward/backward smoke
        run: python -m ultron_core.smoke --device cpu --batch 2 --sequence 8
