name: ULTRON Level 1 Math Tooling

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  level1-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/level1_math
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install "sympy>=1.12" "pytest>=8" torch
      - name: Run regression tests (includes 5,000 randomized cases)
        run: pytest -q
