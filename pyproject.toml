[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ultron-original-core"
version = "0.1.0"
description = "Experimental original mathematical reasoning core"
requires-python = ">=3.10"
dependencies = ["torch>=2.2,<3.0"]

[project.optional-dependencies]
test = ["sympy>=1.12"]
seed-data = ["datasets>=5.0.1,<6", "fsspec>=2026.6.0,<2027", "huggingface_hub>=0.27,<3"]

[tool.setuptools.packages.find]
include = ["ultron_core*"]
